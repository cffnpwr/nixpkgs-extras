name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  list-packages:
    name: List Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92ffb5400c3776307a27a1727d7e2ac3dcd9f844 # v3.18.1
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.cffnpwr.dev
            extra-trusted-public-keys = cffnpwr-nixpkgs-extras:dmp2DUGwdqawLCPOsOcRxU/NpCO/qA1jha/8rmoSzvA=

      - name: List all packages
        run: |
          nix search .#legacyPackages '^'

  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build_all: ${{ steps.detect.outputs.build_all }}
      build_overlays: ${{ steps.detect.outputs.build_overlays }}
      changed_packages: ${{ steps.detect.outputs.changed_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes
        id: detect
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          # Build all packages on push to main
          if [[ "$GH_EVENT_NAME" == "push" ]]; then
            {
              echo "build_all=true"
              echo "build_overlays=true"
              echo "changed_packages=[]"
            } >> "$GITHUB_OUTPUT"
            echo "Push to main detected, building all packages"
            exit 0
          fi

          # Get changed files compared to main
          changed_files=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$changed_files"

          # Check if flake.nix, flake.lock, or build.yaml changed
          if echo "$changed_files" | grep -qE '^(flake\.(nix|lock)|\.github/workflows/build\.yaml)$'; then
            {
              echo "build_all=true"
              echo "build_overlays=true"
              echo "changed_packages=[]"
            } >> "$GITHUB_OUTPUT"
            echo "flake.nix, flake.lock, or build.yaml changed, building all packages"
            exit 0
          fi

          # Check if pkgs/overlays/ changed
          if echo "$changed_files" | grep -qE '^pkgs/overlays/'; then
            build_overlays=true
          else
            build_overlays=false
          fi

          # Extract changed package names from pkgs/<package-name>/
          changed_packages=$(echo "$changed_files" | grep -oE '^pkgs/[^/]+/' | sed 's|pkgs/||; s|/$||' | grep -v '^overlays$' | sort -u)

          echo "build_overlays=$build_overlays" >> "$GITHUB_OUTPUT"

          if [[ -z "$changed_packages" ]]; then
            echo "build_all=false" >> "$GITHUB_OUTPUT"
            echo "changed_packages=[]" >> "$GITHUB_OUTPUT"
            echo "No package changes detected"
          else
            # Convert to JSON array
            json_array=$(echo "$changed_packages" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "build_all=false" >> "$GITHUB_OUTPUT"
            echo "changed_packages=$json_array" >> "$GITHUB_OUTPUT"
            echo "Changed packages: $json_array"
          fi

  generate-matrix:
    name: Generate Build Matrix
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_packages: ${{ steps.set-matrix.outputs.has_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92ffb5400c3776307a27a1727d7e2ac3dcd9f844 # v3.18.1
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.cffnpwr.dev
            extra-trusted-public-keys = cffnpwr-nixpkgs-extras:dmp2DUGwdqawLCPOsOcRxU/NpCO/qA1jha/8rmoSzvA=

      - name: Generate matrix
        id: set-matrix
        env:
          BUILD_ALL: ${{ needs.detect-changes.outputs.build_all }}
          BUILD_OVERLAYS: ${{ needs.detect-changes.outputs.build_overlays }}
          CHANGED_PACKAGES: ${{ needs.detect-changes.outputs.changed_packages }}
        run: |
          # Get full matrix from Nix
          full_matrix=$(nix run .#generate-github-actions-matrix)

          if [[ "$BUILD_ALL" == "true" ]]; then
            echo "Building all packages"
            matrix="$full_matrix"
          else
            echo "Filtering to changed packages: $CHANGED_PACKAGES (build_overlays=$BUILD_OVERLAYS)"
            # Filter matrix to only include changed packages
            # For packages like microsoft-office.excel, check if microsoft-office is in changed_packages
            # For packages like swiftPackages.sourcekitd-inproc or python3Packages.pybit7z,
            # also match against any segment of the dotted package name
            # When build_overlays=true, also include all overlay packages (updatable=false)
            matrix=$(echo "$full_matrix" | jq -c \
              --argjson changed "$CHANGED_PACKAGES" \
              --argjson build_overlays "$BUILD_OVERLAYS" '
              .include |= map(
                select(
                  .package as $pkg |
                  # Include overlay packages when build_overlays is true
                  ($build_overlays and (.updatable == false)) or
                  # Include regular packages that match changed package names
                  ($changed | any(. as $c |
                    $pkg == $c or
                    ($pkg | startswith($c + ".")) or
                    ($pkg | split(".") | last == $c)
                  ))
                )
              )
            ')
          fi

          # Check if matrix has any packages
          has_packages=$(echo "$matrix" | jq '.include | length > 0')
          echo "has_packages=$has_packages" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Matrix: $matrix"

  build-packages:
    name: Build ${{ matrix.package }} (${{ matrix.system }})
    needs: generate-matrix
    if: needs.generate-matrix.outputs.has_packages == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92ffb5400c3776307a27a1727d7e2ac3dcd9f844 # v3.18.1
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.cffnpwr.dev
            extra-trusted-public-keys = cffnpwr-nixpkgs-extras:dmp2DUGwdqawLCPOsOcRxU/NpCO/qA1jha/8rmoSzvA=

      - name: Build ${{ matrix.package }} for ${{ matrix.system }}
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          nix build ".#$PACKAGE" --print-build-logs --system "$SYSTEM" --out-link "$tmpdir/result"
          out=$(readlink -f "$tmpdir/result")
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "tmpdir=$tmpdir" >> "$GITHUB_OUTPUT"

      - name: Collect paths to upload
        id: collect
        env:
          RESULT_LINK: ${{ steps.build.outputs.tmpdir }}/result
        run: |-
          set -euo pipefail

          # Runtime closure of the build output
          runtime_paths=$(nix path-info --recursive "$RESULT_LINK")

          # Also include build-time input paths (inputDrvs outputs + their closures).
          # This ensures packages built with dontBuild/dontUnpack (e.g. sourcekitd-inproc,
          # google-japanese-ime, scroll-reverser) upload their build dependencies such as
          # overridden swift-unwrapped, which would otherwise be missed.
          # Build inputs are best-effort: tolerate missing/invalid paths.
          drv_path=$(nix path-info --derivation "$RESULT_LINK")
          build_input_paths=$(
            nix derivation show "$drv_path" \
              | jq -r '.derivations | to_entries[0].value.inputs.drvs | keys[] | "/nix/store/" + .' \
              | while read -r input_drv; do
                  nix derivation show "$input_drv" 2>/dev/null \
                    | jq -r '.derivations | to_entries[0].value.outputs | to_entries[].value.path | "/nix/store/" + .' \
                    || true
                done \
              | { xargs nix path-info --recursive 2>/dev/null || true; } \
              | sort -u
          )

          paths=$(printf '%s\n%s\n' "$runtime_paths" "$build_input_paths" | sort -u | grep -v '^$' || true)

          if [ -z "$paths" ]; then
            echo "No paths found in closure"
            echo "paths_to_upload=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Filter out paths already in cache.nixos.org. Use POSIX `>/dev/null 2>&1`
          # because Ubuntu's /bin/sh is dash, which interprets the bash-only `&>/dev/null`
          # as `& >/dev/null` (background + null-redirect). With the bash-only form the
          # filter inverts: nixpkgs-overlay packages such as yamlfmt/treefmt (whose hashes
          # differ from the upstream paths in cache.nixos.org) get dropped from the upload
          # set instead of being kept. (issue #86)
          num_cpus=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)
          paths_to_upload=$(echo "$paths" | xargs -P"$num_cpus" -I{} sh -c \
            'nix path-info --store https://cache.nixos.org/ "{}" >/dev/null 2>&1 || echo "{}"')

          if [ -z "$paths_to_upload" ]; then
            echo "All paths already exist in cache.nixos.org"
            echo "paths_to_upload=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          num_paths=$(echo "$paths_to_upload" | wc -l | tr -d ' ')
          echo "Found $num_paths paths to upload to R2."
          paths_to_upload_oneline=$(echo "$paths_to_upload" | tr '\n' ' ')
          echo "paths_to_upload=$paths_to_upload_oneline" >> "$GITHUB_OUTPUT"

      - name: Upload to Cloudflare R2 cache
        if: github.event_name == 'push' && steps.collect.outputs.paths_to_upload != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NIX_SECRET_KEY: ${{ secrets.NIX_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PATHS_TO_UPLOAD: ${{ steps.collect.outputs.paths_to_upload }}
          BUILD_TMPDIR: ${{ steps.build.outputs.tmpdir }}
        run: |-
          set -euo pipefail
          key_file=$(mktemp)
          trap 'rm -f "$key_file"; rm -rf "$BUILD_TMPDIR"' EXIT
          echo "$NIX_SECRET_KEY" > "$key_file"

          echo "Uploading to R2..."
          # shellcheck disable=SC2086
          nix copy \
            --no-check-sigs \
            --to "s3://${R2_BUCKET}?endpoint=${R2_ENDPOINT}&region=auto&compression=zstd&parallel-compression=true&secret-key=${key_file}" \
            $PATHS_TO_UPLOAD
